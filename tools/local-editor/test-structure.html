<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>로컬 편집기 구성 검증</title></head>
<body><h1>로컬 편집기 구성 검증</h1><pre id="result">실행 중</pre>
<script src="structure.js"></script>
<script>
(async () => {
  const results = [];
  const assert = (value,message) => { if (!value) throw new Error(message); };
  const uiRoot = document.createElement('div'); uiRoot.hidden = true; document.body.append(uiRoot);
  const ids = ['outline','structureStatus','selectedBlock','insertType','insertPosition','imageColumns','insertBlock','moveUp','moveDown','duplicateBlock','deleteBlock','editImage','imageDialog','imageFields','imageSuggestions','imageApply','imageCancel','imageSummary'];
  const ui = Object.fromEntries(ids.map(id => {
    const element = document.createElement(id === 'imageDialog' ? 'dialog' : ['insertType','insertPosition','imageColumns'].includes(id) ? 'select' : ['insertBlock','moveUp','moveDown','duplicateBlock','deleteBlock','editImage','imageApply','imageCancel'].includes(id) ? 'button' : id === 'imageSuggestions' ? 'datalist' : 'div');
    element.id = id; uiRoot.append(element); return [id,element];
  }));
  for (const [id,values] of [['insertType',['section','heading','paragraph','tip','step','divider','image']],['insertPosition',['after','inside','before']],['imageColumns',['1','2','3']]]) for (const value of values) {
    const option = document.createElement('option'); option.value = option.textContent = value; ui[id].append(option);
  }
  const iframe = document.createElement('iframe'); iframe.hidden = true; document.body.append(iframe);
  const doc = iframe.contentDocument;
  doc.open(); doc.write('<!doctype html><html><head></head><body><section class="guide-detail"><!--local-region:r0:start--><h1>상단 제목</h1><!--local-region:r0:end--><!--local-region:r1:start--><section id="T1"><h2 data-local-block="0">원래 섹션</h2><p data-local-block="1">원래 설명</p><figure class="guide-image-slot"><img src="/assets/images/original.webp" alt="원래 이미지"><figcaption data-local-block="2">원래 설명 이미지</figcaption></figure></section><!--local-region:r1:end--><!--local-region:r2:start--><p data-local-block="3">마지막 문단</p><!--local-region:r2:end--><!--local-region:r3:start--><h2>고정 경계</h2><!--local-region:r3:end--><!--local-region:r4:start--><div class="mb-3"><img src="/assets/images/legacy.webp" alt="기존 이미지"><p data-local-block="4">기존 이미지 캡션</p></div><!--local-region:r4:end--></section></body></html>'); doc.close();
  const state = {path:'pages/L04SAMPLE.html',structure:{allowed:true},regions:[
    {id:'r0',tag:'h1',label:'상단 제목',protected:true,anchorIds:[]},
    {id:'r1',tag:'section',label:'원래 섹션',protected:false,anchorIds:['T1']},
    {id:'r2',tag:'p',label:'마지막 문단',protected:false,anchorIds:[]},
    {id:'r3',tag:'h2',label:'고정 경계',protected:true,anchorIds:[]},
    {id:'r4',tag:'div',label:'기존 이미지 캡션',protected:false,anchorIds:[]}
  ]};
  const errors = [], history = [], selections = [], moves = [];
  let api, count = 0, busy = false;
  const confirm = window.confirm; window.confirm = () => true;
  const bindText = () => doc.querySelectorAll('[data-local-block]').forEach(element => element.contentEditable = 'true');
  api = JJSTAR_EDITOR_BLOCKS.create({doc,state,ui,beforeChange:() => history.push(api.snapshot()),onChange:() => count++,bindText,isBusy:() => busy,message:(message,error) => { if (error) errors.push(message); },request:async () => ({images:[{name:'existing.webp',path:'assets/images/existing.webp'}]}),onSelectionChange:(element,path) => selections.push({element,path}),onMove:elements => moves.push(elements)});
  const initial = api.snapshot();
  const select = text => {
    const button = [...ui.outline.querySelectorAll('.outline-item')].find(button => button.textContent.includes(text));
    assert(button,'선택할 영역 없음: ' + text); button.onclick();
  };
  const test = (name,fn) => { fn(); results.push({name,pass:true}); };
  const rowFor = element => {
    api.select(element);
    const row = ui.outline.querySelector('.outline-row.selected');
    assert(row,'선택한 트리 행이 없음'); return row;
  };
  const drop = (source,target,side = 'after') => {
    const from = rowFor(source), to = rowFor(target), transfer = new DataTransfer();
    to.getBoundingClientRect = () => ({top:10,height:20,bottom:30,left:0,right:200,width:200});
    from.dispatchEvent(new DragEvent('dragstart',{bubbles:true,cancelable:true,dataTransfer:transfer}));
    const clientY = side === 'before' ? 15 : 25;
    const over = new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY});
    to.dispatchEvent(over);
    to.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY}));
    from.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:transfer}));
    return over.defaultPrevented;
  };
  const itemByText = text => {
    const item = [...ui.outline.querySelectorAll('.outline-item')].find(item => item.textContent.includes(text));
    assert(item,'선택할 항목 없음: ' + text); return item;
  };
  const clickItem = (text,modifiers = {}) => itemByText(text).dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,...modifiers}));
  const multiFixture = () => {
    api.restore(initial); doc.getSelection()?.removeAllRanges(); history.length = 0;
    const section = doc.getElementById('T1');
    for (const [index,text] of ['다중 가','다중 나','다중 다','다중 라'].entries()) {
      const paragraph = doc.createElement('p'); paragraph.id = 'multi-' + index; paragraph.textContent = text; section.append(paragraph);
    }
    api.refresh();
    return [...section.querySelectorAll('[id^="multi-"]')];
  };
  const multiOrder = () => [...doc.getElementById('T1').children].filter(element => element.id.startsWith('multi-')).map(element => element.id).join(',');
  const dropSelected = (sourceText,targetText,side = 'after') => {
    const from = itemByText(sourceText).closest('.outline-row'), to = itemByText(targetText).closest('.outline-row'), transfer = new DataTransfer();
    to.getBoundingClientRect = () => ({top:10,height:20,bottom:30,left:0,right:200,width:200});
    from.dispatchEvent(new DragEvent('dragstart',{bubbles:true,cancelable:true,dataTransfer:transfer}));
    to.dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY:side === 'before' ? 15 : 25}));
    to.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY:side === 'before' ? 15 : 25}));
    from.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:transfer}));
  };
  const parentFixture = (top = false) => {
    api.restore(initial); doc.getSelection()?.removeAllRanges();
    const group = doc.createElement('div'); group.id = 'parent-group'; group.className = 'space-y-4 mb-8';
    for (let number = 1; number <= 5; number++) {
      const row = doc.createElement('div'); row.className = 'flex gap-4 items-start'; row.id = 'parent-row-' + number;
      row.innerHTML = '<div>' + number + '</div><p>부모 행 ' + number + '</p>'; group.append(row);
    }
    if (top) {
      select('마지막 문단'); ui.insertType.value = 'section'; ui.insertPosition.value = 'after'; ui.insertBlock.onclick();
      api.getSelectedElements()[0].replaceWith(group); api.markText(group);
    } else doc.getElementById('T1').append(group);
    api.refresh(); history.length = 0;
    return {group,rows:[...group.children]};
  };
  const parentRowItem = element => {
    const title = '묶음 · ' + element.textContent.trim().replace(/\s+/g,' ').slice(0,48);
    const item = [...ui.outline.querySelectorAll('.outline-item')].find(item => item.textContent === title);
    assert(item,'부모 행을 찾지 못함: ' + title); return item;
  };
  const chooseRows = (rows,count = rows.length) => {
    api.select(rows[0]);
    rows.slice(1,count).forEach(row => parentRowItem(row).dispatchEvent(new MouseEvent('click',{bubbles:true,ctrlKey:true})));
  };
  try {
    test('원래 HTML을 변경하지 않고 시작', () => {
      assert(!api.changed(),'초기 상태가 변경으로 표시됨'); assert(api.layout() === undefined,'변경 없는 저장에 layout 포함');
      assert(ui.outline.querySelectorAll('button').length >= 6,'하위 영역 목록 누락');
    });
    test('figure와 기존 이미지 묶음은 기본 접힘', () => {
      const figure = doc.querySelector('figure'), legacy = doc.querySelector('img[src*=legacy]').parentElement;
      for (const group of [figure,legacy]) {
        const row = rowFor(group);
        assert(row.querySelector('.outline-toggle').getAttribute('aria-expanded') === 'false','이미지 묶음이 처음부터 펼쳐짐');
        assert(![...ui.outline.querySelectorAll('.outline-item')].some(item => item.textContent.startsWith('캡션 ·')),'접힌 이미지의 캡션이 중복 표시됨');
      }
      assert(!api.changed(),'선택만으로 변경 처리됨');
    });
    test('이미지 묶음 펼침과 하위 선택은 저장 내용을 바꾸지 않음', () => {
      const legacy = doc.querySelector('img[src*=legacy]').parentElement;
      rowFor(legacy).querySelector('.outline-toggle').click();
      assert([...ui.outline.querySelectorAll('.outline-item')].some(item => item.textContent.startsWith('캡션 · 기존 이미지 캡션')),'기존 캡션 행 누락');
      api.select(legacy.querySelector('p'));
      assert(ui.moveUp.disabled && ui.moveDown.disabled && ui.deleteBlock.disabled && ui.duplicateBlock.disabled,'이미지·캡션 분리 허용');
      assert(!ui.editImage.disabled,'캡션 선택 후 이미지 설정 불가');
      assert(!api.changed() && api.layout() === undefined,'접힘 UI가 저장 변경에 포함됨');
      api.restore(initial);
    });
    test('본문 이미지·캡션 클릭은 이미지 묶음을 선택', () => {
      for (const selector of ['figure img','figure figcaption','img[src*=legacy]','img[src*=legacy] + p']) {
        api.restore(initial);
        doc.querySelector(selector).dispatchEvent(new MouseEvent('click',{bubbles:true}));
        const row = ui.outline.querySelector('.outline-row.selected');
        assert(row.querySelector('.outline-item').textContent.startsWith('이미지 묶음 ·'),'본문 클릭이 하위 이미지 또는 캡션을 선택함');
        assert(row.querySelector('.outline-toggle').getAttribute('aria-expanded') === 'false','본문 클릭으로 이미지 묶음이 불필요하게 펼쳐짐');
      }
      api.restore(initial);
    });
    test('기존 이미지 더블클릭은 캡션을 함께 설정', () => {
      const image = doc.querySelector('img[src*=legacy]');
      image.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,cancelable:true}));
      assert(ui.imageDialog.open,'기존 이미지 설정 창 누락');
      assert(ui.imageFields.querySelector('[data-image-field="caption"]').value === '기존 이미지 캡션','더블클릭으로 캡션 연결 손실');
      ui.imageDialog.close(); assert(!api.changed(),'이미지 설정 열기만으로 변경 처리됨');
      api.restore(initial);
    });
    test('고정 영역은 삭제와 이동 제한', () => {
      select('상단 제목'); assert(ui.deleteBlock.disabled && ui.moveUp.disabled,'고정 영역 관리 버튼 활성화');
    });
    test('기존 섹션에 문단 추가 및 원래 앵커 유지', () => {
      select('섹션 · 원래 섹션'); ui.insertType.value = 'paragraph'; ui.insertPosition.value = 'inside'; ui.insertBlock.onclick();
      const layout = api.layout(), changed = layout.find(entry => entry.id === 'r1');
      assert(changed.html.includes('여기에 설명을 입력하세요'),'문단 추가 실패');
      assert(changed.html.includes('id="T1"'),'기존 앵커 손실');
      assert(!changed.html.includes('data-local-') && !changed.html.includes('contenteditable'),'임시 편집 속성 저장');
      assert(!('html' in layout.find(entry => entry.id === 'r0')),'고정 영역 직렬화');
    });
    test('추가 후 되돌리기 및 재적용', () => {
      const after = api.snapshot(); api.restore(history.pop());
      assert(!api.changed(),'되돌린 뒤 초기 상태와 다름');
      assert(!doc.getElementById('T1').textContent.includes('여기에 설명을 입력하세요'),'추가 문단 잔존');
      api.restore(after); assert(api.changed(),'다시 실행 상태 복구 실패');
    });
    test('앵커가 있는 섹션은 삭제·중복 제한', () => {
      select('섹션 · 원래 섹션'); assert(ui.deleteBlock.disabled && ui.duplicateBlock.disabled,'연결 앵커 삭제 허용');
    });
    test('새 섹션 추가·복제·순서 이동·삭제', () => {
      select('마지막 문단'); ui.insertType.value = 'section'; ui.insertPosition.value = 'after'; ui.insertBlock.onclick();
      const first = api.layout().find(entry => entry.id.startsWith('new-'));
      assert(first?.html.includes('jjstar-head-title.svg'),'기존 디자인 제목 누락');
      ui.duplicateBlock.onclick(); assert(api.layout().filter(entry => entry.id.startsWith('new-')).length === 2,'섹션 복제 실패');
      const before = api.layout().map(entry => entry.id).join(','); ui.moveUp.onclick();
      assert(api.layout().map(entry => entry.id).join(',') !== before,'섹션 순서 이동 실패');
      ui.deleteBlock.onclick(); assert(api.layout().filter(entry => entry.id.startsWith('new-')).length === 1,'섹션 삭제 실패');
    });
    test('잘못된 이미지 파일명 거부', () => {
      for (const name of ['../outside.webp','https://example.com/p.png','test<script>.png','test.exe']) {
        let blocked = false; try { JJSTAR_EDITOR_BLOCKS.safeName(name); } catch (_) { blocked = true; }
        assert(blocked,'허용되면 안 되는 파일명: ' + name);
      }
      assert(JJSTAR_EDITOR_BLOCKS.safeName('assets/images/예시-01.webp') === '예시-01.webp','로컬 이미지 경로 정규화 실패');
    });
    select('마지막 문단'); ui.insertType.value = 'image'; ui.imageColumns.value = '3'; ui.insertPosition.value = 'after'; ui.insertBlock.onclick();
    await Promise.resolve();
    test('세 장 이미지 파일명·설명·캡션 배치', () => {
      assert(ui.imageFields.querySelectorAll('fieldset').length === 3,'이미지3장 필드 누락');
      [...ui.imageFields.querySelectorAll('fieldset')].forEach((field,index) => {
        field.querySelector('[data-image-field="name"]').value = `sample-${index+1}.webp`;
        field.querySelector('[data-image-field="alt"]').value = `화면 설명 ${index+1}`;
        field.querySelector('[data-image-field="caption"]').value = `하단 설명 ${index+1}`;
      });
      ui.imageApply.onclick({preventDefault(){}});
      const image = api.layout().find(entry => entry.html?.includes('sample-1.webp'));
      assert(image?.html.includes('guide-image-row'),'가로배치 누락');
      assert((image.html.match(/<figure/g) || []).length === 3,'이미지 개수 불일치');
      assert(image.html.includes('sample-3.webp') && image.html.includes('하단 설명 3'),'마지막 이미지 설명 누락');
      assert(!/data-local-|local-image-missing|local-structure-selected|contenteditable/.test(image.html),'편집용 속성 잔존');
    });
    test('기존 이미지의 이름과 설명 변경', () => {
      select('원래 설명 이미지'); ui.editImage.onclick();
      const field = ui.imageFields.querySelector('fieldset');
      field.querySelector('[data-image-field="name"]').value = 'replacement.webp';
      field.querySelector('[data-image-field="alt"]').value = '변경한 이미지 설명';
      field.querySelector('[data-image-field="caption"]').value = '변경한 하단 설명';
      ui.imageApply.onclick({preventDefault(){}});
      const region = api.layout().find(entry => entry.id === 'r1');
      assert(region.html.includes('assets/images/replacement.webp') && region.html.includes('변경한 이미지 설명') && region.html.includes('변경한 하단 설명'),'기존 이미지 변경 저장 실패');
    });
    test('구성 변경이 저장 전 확인 목록에 표시', () => {
      assert(api.summary().some(item => item.startsWith('추가')),'추가 변경 요약 누락'); assert(count >= 7,'변경 이벤트 누락');
      assert(!errors.length,'예상하지 못한 오류: ' + errors.join('/'));
    });
    test('기존 이미지의 캡션 설정 유지', () => {
      api.restore(initial);
      select('이미지 묶음 · 기존 이미지 캡션'); ui.editImage.onclick();
      const field = ui.imageFields.querySelector('fieldset');
      assert(field.querySelector('[data-image-field="caption"]').value === '기존 이미지 캡션','기존 캡션을 읽지 못함');
      field.querySelector('[data-image-field="caption"]').value = '바뀐 기존 캡션';
      ui.imageApply.onclick({preventDefault(){}});
      assert(doc.querySelector('img[src*=legacy]').nextElementSibling.textContent === '바뀐 기존 캡션','기존 캡션 변경 실패');
      assert(api.layout().find(item => item.id === 'r4').html.includes('바뀐 기존 캡션'),'기존 캡션 저장 누락');
    });
    test('형제 문단 드래그와 한 번의 되돌리기', () => {
      api.restore(initial); history.length = 0;
      const section = doc.getElementById('T1'), paragraph = section.querySelector('p'), figure = section.querySelector('figure');
      assert(drop(paragraph,figure),'형제 드롭이 허용되지 않음');
      assert(figure.nextElementSibling === paragraph,'형제 순서 변경 실패');
      assert(history.length === 1,'드롭 한 번이 여러 되돌리기 단계로 기록됨');
      assert(api.layout().find(item => item.id === 'r1').html.includes('<figure'),'변경된 영역 누락');
      api.restore(history.pop());
      assert(!api.changed() && doc.getElementById('T1').querySelector('p').nextElementSibling.matches('figure'),'드롭 되돌리기 실패');
    });
    test('드래그 앞뒤 삽입선과 취소는 내용 유지', () => {
      api.restore(initial);
      const paragraph = doc.getElementById('T1').querySelector('p'), figure = doc.querySelector('figure');
      const from = rowFor(paragraph), to = rowFor(figure), transfer = new DataTransfer();
      to.getBoundingClientRect = () => ({top:10,height:20});
      const originalRow = from;
      from.dispatchEvent(new DragEvent('dragstart',{bubbles:true,cancelable:true,dataTransfer:transfer}));
      api.refresh();
      assert(from.isConnected && from === originalRow,'드래그 중 행이 교체됨');
      to.dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY:15}));
      assert(to.classList.contains('drop-before'),'앞 삽입선 누락');
      to.dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:transfer,clientY:25}));
      assert(to.classList.contains('drop-after') && !to.classList.contains('drop-before'),'뒤 삽입선 갱신 실패');
      from.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:transfer}));
      assert(!ui.outline.querySelector('.drop-before,.drop-after,.dragging') && !api.changed(),'드래그 취소 후 변경 또는 표시 잔존');
    });
    test('최상위 이동은 마커와 영역 순서를 함께 유지', () => {
      api.restore(initial); history.length = 0;
      const section = doc.getElementById('T1'), last = doc.querySelector('[data-local-block="3"]');
      assert(drop(last,section,'before'),'최상위 형제 드롭 거부');
      assert(api.layout().map(item => item.id).join(',') === 'r0,r2,r1,r3,r4','영역 배열 순서 불일치');
      const markup = doc.querySelector('.guide-detail').innerHTML;
      assert(markup.indexOf('local-region:r2:start') < markup.indexOf('local-region:r1:start'),'마커 순서 불일치');
      assert(history.length === 1,'최상위 이동 기록 불일치');
      api.restore(history.pop()); assert(!api.changed(),'최상위 되돌리기 실패');
    });
    test('다른 부모·순환·고정 경계 드롭 차단', () => {
      for (const target of ['cross-parent','cycle','barrier']) {
        api.restore(initial); history.length = 0;
        const section = doc.getElementById('T1'), paragraph = section.querySelector('p');
        const source = target === 'barrier' ? doc.querySelector('img[src*=legacy]').parentElement : target === 'cycle' ? section : paragraph;
